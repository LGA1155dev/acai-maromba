box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#12041a}
body{margin:0;background:#12041a;overflow-x:clip;font-family:'Montserrat',system-ui,sans-serif}
.track{position:relative;height:260vh;height:260svh}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#12041a}
.fill{position:absolute;inset:-6%;background:var(--bg) center/cover;filter:blur(28px) brightness(.8)}
.stage{position:relative;flex:none;width:100vw;aspect-ratio:1672/941}
.bg{position:absolute;inset:0;-webkit-mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);background:var(--bg) center/100% 100%;transform:scale(1.03);will-change:transform;animation:fade .8s ease both}
.panel,.mhead{display:none}
.abs{position:absolute}
.in{display:block;animation:rise .9s var(--ease) both;animation-delay:var(--d,0s)}
.in img,#wtxt{will-change:transform}
.in img{display:block}
img{width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.word{left:0;right:0;top:51%;z-index:1;text-align:center;transform:translateY(-50%);--d:.3s;pointer-events:none}
.word span{display:inline-block;transform-origin:50% 50%;font:800 italic 100px/1 'Montserrat',system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.03em;white-space:nowrap;padding:0 .08em;
background:linear-gradient(180deg,#d9c6e0 0%,#bd9ccb 50%,#8a56a6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.92}
.acai{left:50%;bottom:5.5%;height:72%;aspect-ratio:635/1100;transform:translateX(-50%);z-index:3;--d:.55s}
.acai .in,.acai img{height:100%}
.acai img{transform-origin:50% 90%}
.ch{left:var(--x);top:var(--y);width:var(--w);transform:translate(-50%,-50%);z-index:var(--z,2)}
.ch .in{--d:calc(.85s + var(--i)*.08s);animation-name:rise-s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translate3d(0,26px,0)}to{opacity:1;transform:none}}
@keyframes rise-s{from{opacity:0;transform:translate3d(0,16px,0) scale(.92)}to{opacity:1;transform:none}}
@media (max-width:760px),(orientation:portrait){
 .fill{display:none}
 .stage{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}
 .bg{background:var(--bgm) center/cover;-webkit-mask-image:none;mask-image:none}
 .panel{display:block;position:absolute;inset:max(14px,env(safe-area-inset-top,0px)) 14px 14px;border-radius:28px;border:1px solid rgba(214,170,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));pointer-events:none;animation:fade .8s ease both}
 .mhead{display:flex;position:absolute;z-index:6;left:30px;right:30px;top:max(30px,calc(env(safe-area-inset-top,0px) + 16px));align-items:center;justify-content:space-between;animation:rise .8s var(--ease) .15s both}
 .mhead img{width:clamp(48px,13vw,76px)}
 .mhead button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(214,170,255,.55);background:rgba(40,10,60,.45);color:#fff;display:grid;place-content:center;gap:5px;cursor:pointer}
 .mhead button i{display:block;width:18px;height:2px;background:#fff;border-radius:2px;transition:transform .25s,opacity .25s}
 .mhead[data-open] button i:nth-child(1){transform:translateY(7px) rotate(45deg)}
 .mhead[data-open] button i:nth-child(2){opacity:0}
 .mhead[data-open] button i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
 .mhead nav{position:absolute;right:0;top:58px;display:none;flex-direction:column;gap:2px;min-width:200px;padding:10px;border-radius:20px;background:rgba(36,8,54,.92);border:1px solid rgba(214,170,255,.3)}
 .mhead[data-open] nav{display:flex}
 .mhead nav a{color:#fff;text-decoration:none;font:500 15px/1 'Montserrat',sans-serif;text-transform:uppercase;padding:14px 12px;border-radius:12px}
 .mhead nav a.on{color:#e07cff;font-weight:700}
 .mhead nav a.cta{border:1px solid rgba(214,170,255,.6);text-align:center;margin-top:6px;font-weight:700}
 .word{top:42%}
 .acai{height:min(50vh,112vw);bottom:6%}
 .ch{left:var(--mx);top:var(--my);width:var(--mw)}
}
@supports (height:1svh){@media (max-width:760px),(orientation:portrait){.acai{height:min(50svh,112vw)}}}
@media (prefers-reduced-motion:reduce){.bg,.panel,.mhead,.in{animation:none!important}}
</style>
</head>
<body>
<main class="track" id="track">
<div class="sticky">
<div class="fill" aria-hidden="true"></div>
<div class="stage" id="stage">
 <div class="bg" id="bg" role="img" aria-label="Fundo roxo com painel de vidro"></div>

<script>
(function(){
var mqReduce=matchMedia('(prefers-reduced-motion: reduce)'),reduce=mqReduce.matches;
var track=document.getElementById('track'),stage=document.getElementById('stage'),bg=document.getElementById('bg'),
    wtxt=document.getElementById('wtxt'),acai=document.getElementById('acaiImg'),
    chs=[].map.call(document.querySelectorAll('.ch'),function(e){return{img:e.querySelector('img'),k:+e.dataset.k,r:+e.dataset.r,s:+e.dataset.s,x:+e.dataset.x}});
/* Flutuação por pedaço: [ampX, ampY, ampRot(deg), velX, velY, velRot (rad/s), fase] — períodos de ~6 a 12 s */
var CF=[[.32,.62,3.5,.62,.80,.50,0],[.38,.70,3.0,.55,.72,.44,1.9],[.34,.66,3.5,.60,.76,.48,3.7],
        [.50,.85,5.0,.85,1.00,.70,.8],[.45,.80,5.0,.78,.92,.66,2.6],[.50,.85,6.0,.90,1.05,.72,4.4],[.45,.80,5.0,.82,.98,.68,5.5]];
for(var j=0;j<chs.length;j++)chs[j].f=CF[j%CF.length];
var sw=0,sh=0,range=1,cur=0,target=0,raf=0,mobile=false,u=10,rk=1,t0=0,amp=0,lastT=0,inView=true,running=false;
function fit(){
  wtxt.style.fontSize='100px';
  var w=wtxt.getBoundingClientRect().width||1;
  wtxt.style.fontSize=(100*sw*(mobile?.9:.87)/w)+'px';
}
function layout(){
  mobile=matchMedia('(max-width:760px),(orientation:portrait)').matches;
  sw=stage.clientWidth;sh=stage.clientHeight;
  range=Math.max(1,track.offsetHeight-innerHeight);
  u=mobile?6:Math.min(18,sw/100);   /* unidade de deslocamento: menor no mobile */
  rk=mobile?.65:1;                  /* rotação reduzida no mobile */
  fit();target=read();cur=reduce?0:target;render(cur,lastT,amp);
}
function read(){return Math.min(1,Math.max(0,scrollY/range))}
function render(p,t,a){
  bg.style.transform='translate3d(0,'+(-.012*sh*p)+'px,0) scale(1.03)';
  wtxt.style.transform='translate3d(0,'+(-.05*sh*p)+'px,0) scale('+(1+.03*p)+')';
  /* Copo: flutuação mínima + parallax de scroll (deslocamento, escala e inclinação) */
  var cy=Math.sin(t*.55)*.0045*sh*a, cx=Math.sin(t*.37+1)*.0012*sw*a,
      ct=Math.sin(t*.46+.5)*.35*a*rk, cs=Math.sin(t*.5)*.004*a;
  acai.style.transform='translate3d('+cx+'px,'+(-.03*sh*p+cy)+'px,0) scale('+(1+.06*p+cs)+') rotate('+(-1.2*p+ct)+'deg)';
  for(var i=0;i<chs.length;i++){var c=chs[i],f=c.f,ph=f[6];
    var fx=u*f[0]*(Math.sin(f[3]*t+ph)+.35*Math.sin(f[3]*2.3*t+ph*1.3))*a,
        fy=u*f[1]*(Math.sin(f[4]*t+ph*1.7)+.3*Math.sin(f[4]*2.1*t+ph))*a,
        fr=f[2]*rk*Math.sin(f[5]*t+ph*.6)*a;
    c.img.style.transform='translate3d('+(c.x*sw/100*p+fx)+'px,'+(-c.k*sh*p+fy)+'px,0) rotate('+(c.r*p+fr)+'deg) scale('+(1+c.s*p)+')';}
}
function frame(now){
  raf=0;if(!running)return;
  if(!t0)t0=now;
  var e=Math.min(1,(now-t0)/2400);amp=e*e*(3-2*e);   /* entrada suave da flutuação */
  lastT=now/1000;
  target=read();cur+=(target-cur)*.12;
  if(Math.abs(target-cur)<.0004)cur=target;
  render(cur,lastT,amp);
  raf=requestAnimationFrame(frame);
}
function sync(){
  var want=!reduce&&inView&&!document.hidden;
  if(want&&!running){running=true;raf=requestAnimationFrame(frame)}
  else if(!want&&running){running=false;if(raf){cancelAnimationFrame(raf);raf=0}}
}
if('IntersectionObserver' in window){
  new IntersectionObserver(function(en){inView=en[0].isIntersecting;sync()},{rootMargin:'100px 0px'}).observe(track);
}
document.addEventListener('visibilitychange',sync);
mqReduce.addEventListener&&mqReduce.addEventListener('change',function(e){reduce=e.matches;if(reduce){amp=0;cur=0}else{t0=0}layout();sync()});
addEventListener('resize',layout);
layout();sync();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
var mh=document.getElementById('mhead'),btn=mh.querySelector('button');
btn.addEventListener('click',function(){var o=mh.hasAttribute('data-open');o?mh.removeAttribute('data-open'):mh.setAttribute('data-open','');btn.setAttribute('aria-expanded',String(!o))});
})();
